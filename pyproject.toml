[project]
name = "rote"
version = "0.1.0"
description = "Record-once, replay-many computer use: an LLM discovers a UI task once, the run becomes a typed capability, and deterministic replay executes it without the model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=2.2",
    "playwright>=1.48",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
rote = "rote.cli:main"
mockbank = "mockbank.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rote", "src/mockbank"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["browser: tests that drive a real Chromium against the mock bank"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "RUF",  # errors, imports, bugbear, pyupgrade, simplify, ruff
    "ASYNC",  # no blocking calls on the event loop (the operator console shares it with automation)
    "C4", "PERF", "FURB", "PIE", "RET", "RSE",  # idiomatic, efficient Python
    "DTZ",  # timezone-aware datetimes: evidence timestamps are compared across machines
    "G", "LOG",  # logging hygiene
    "ICN", "ISC", "PTH",  # import conventions, string concatenation, pathlib
    "PT",  # pytest style
]
ignore = ["RUF012", "B008", "E501"]  # line width is owned by `ruff format`

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# New code is held to strict typing; older modules are migrated as they are touched.
module = ["rote.evals.*", "rote.web.evals", "rote.web.agents", "rote.web.models"]
strict = true
