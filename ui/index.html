<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>rote · capability studio</title>
    <meta name="theme-color" content="#f5f4f1" />
    <script>
      // Day is the default; apply a saved Night choice before first paint to avoid a flash.
      try {
        if (localStorage.getItem("rote.theme") === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
